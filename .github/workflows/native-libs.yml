name: Native Monero Libs v0.18.5.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'external-libs/Makefile'
      - 'external-libs/build.sh'
      - 'external-libs/Containerfile'
      - '.github/workflows/native-libs.yml'

permissions:
  contents: read

env:
  MONERO_TAG: v0.18.5.3
  MONERO_COMMIT: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0

jobs:
  build-native:
    name: Build arm64 + armv7 static libs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/prebuilt
            external-libs/VERSION
          key: anon-native-${{ env.MONERO_TAG }}-${{ env.MONERO_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile', 'app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Checkout Monero ${{ env.MONERO_TAG }}
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf external-libs/monero
          git clone --depth 1 --branch "${MONERO_TAG}" \
            https://github.com/monero-project/monero.git external-libs/monero
          git -C external-libs/monero submodule update --init --recursive --depth 1
          echo "Monero HEAD: $(git -C external-libs/monero rev-parse HEAD)"
          echo "Expected:    ${MONERO_COMMIT}"

      - name: Build Android native libs (Docker)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make android NPROC="$(nproc)"
          echo "==== arm64-v8a ===="
          find arm64-v8a -name '*.a' | wc -l
          ls -la arm64-v8a/monero/libwallet_api.a arm64-v8a/libpolyseed.a 2>/dev/null || true
          echo "==== armeabi-v7a ===="
          find armeabi-v7a -name '*.a' | wc -l
          test -f include/wallet2_api.h
          test -s arm64-v8a/monero/libwallet_api.a
          test -s armeabi-v7a/monero/libwallet_api.a

      - name: Build and cache JNI shared libraries (C++ stays out of APK workflow)
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for abi in arm64-v8a armeabi-v7a; do
            build_dir="$RUNNER_TEMP/anonero-$abi"
            cmake -S app -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build_dir" --target anonero --parallel "$(nproc)"
            mkdir -p "external-libs/prebuilt/$abi"
            install -m 0644 "$build_dir/libanonero.so" "external-libs/prebuilt/$abi/libanonero.so"
            install -m 0644 "$NDK/sources/cxx-stl/llvm-libc++/libs/$abi/libc++_shared.so" "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            echo "$abi: cached libanonero.so + libc++_shared.so"
          done

      - name: Write VERSION stamp
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "ANONERO monero ${MONERO_TAG} (${MONERO_COMMIT}) built $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > external-libs/VERSION
          cat external-libs/VERSION

      - name: Upload native libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: monero-android-libs-${{ env.MONERO_TAG }}
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/prebuilt
            external-libs/VERSION
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          echo "### Monero ${MONERO_TAG} native libs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache hit: ${{ steps.native-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: monero-android-libs-${MONERO_TAG}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f external-libs/VERSION ]; then cat external-libs/VERSION >> "$GITHUB_STEP_SUMMARY"; fi
          find external-libs/arm64-v8a external-libs/armeabi-v7a -name '*.a' 2>/dev/null | wc -l \
            | xargs -I{} echo "- Static archives: {}" >> "$GITHUB_STEP_SUMMARY"
