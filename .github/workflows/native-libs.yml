name: Dump Monero API patch rejects

on:
  push:
    branches: [ fix/native-source-compat ]
    paths:
      - '.github/workflows/native-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-rejects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump reject hunks to Actions log
        shell: bash
        run: |
          set -euo pipefail
          MONERO_COMMIT=43c31c2aacdd789404d16cfda0c5456e0a090b86
          PATCH_BASE=33671871de3d51696b66ffb3bd94f744e26974f6
          git init monero
          git -C monero remote add origin https://github.com/monero-project/monero.git
          git -C monero fetch --depth 1 origin "$MONERO_COMMIT"
          git -C monero checkout --detach FETCH_HEAD
          curl -fsSL "https://raw.githubusercontent.com/MrCyjaneK/monero_c/$PATCH_BASE/patches/monero/0008-coin-control.patch" -o "$RUNNER_TEMP/0008.patch"
          set +e
          git -C monero apply --reject "$RUNNER_TEMP/0008.patch" > "$RUNNER_TEMP/apply.log" 2>&1
          set -e
          cat "$RUNNER_TEMP/apply.log" | tail -100
          echo "=== REJECT FILES ==="
          while IFS= read -r f; do
            echo "===== $f ====="
            cat "$f"
          done < <(find monero -name '*.rej' -print)
          echo "=== APPLY STATUS ==="
          git -C monero status --short
          echo "=== NEW/CHANGED COIN API REFERENCES ==="
          grep -nE 'struct CoinsInfo|struct Coins|coins\(\)|preferred_inputs|m_coins|WalletImpl::coins' monero/src/wallet/api/wallet2_api.h monero/src/wallet/api/wallet.h monero/src/wallet/api/wallet.cpp 2>/dev/null | head -150 || true
