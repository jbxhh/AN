name: Probe Monero API patches

on:
  push:
    branches: [ fix/native-source-compat ]
    paths:
      - '.github/workflows/native-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check patch compatibility against pinned Monero source
        shell: bash
        run: |
          set -euo pipefail
          MONERO_COMMIT=43c31c2aacdd789404d16cfda0c5456e0a090b86
          PATCH_BASE=33671871de3d51696b66ffb3bd94f744e26974f6
          git init monero
          git -C monero remote add origin https://github.com/monero-project/monero.git
          git -C monero fetch --depth 1 origin "$MONERO_COMMIT"
          git -C monero checkout --detach FETCH_HEAD
          echo "=== Current Polyseed API ==="
          grep -nE 'getPolyseed\(|hasUnknownKeyImages|viewOnlyBalance|struct Coins|class Coins|createTransaction\(' monero/src/wallet/api/wallet2_api.h | head -40 || true
          mkdir -p "$RUNNER_TEMP/patches"
          curl -fsSL "https://raw.githubusercontent.com/MrCyjaneK/monero_c/$PATCH_BASE/patches/monero/0005-UR-functions.patch" -o "$RUNNER_TEMP/patches/0005.patch"
          curl -fsSL "https://raw.githubusercontent.com/MrCyjaneK/monero_c/$PATCH_BASE/patches/monero/0008-coin-control.patch" -o "$RUNNER_TEMP/patches/0008.patch"
          echo "=== UR-functions patch check ==="
          if git -C monero apply --check "$RUNNER_TEMP/patches/0005.patch"; then
            echo "PATCH_0005_CHECK=PASS"
          else
            echo "PATCH_0005_CHECK=FAIL"
          fi
          echo "=== Coin-control patch check ==="
          if git -C monero apply --check "$RUNNER_TEMP/patches/0008.patch"; then
            echo "PATCH_0008_CHECK=PASS"
          else
            echo "PATCH_0008_CHECK=FAIL"
          fi
