name: Probe API migration hunks

on:
  push:
    branches: [ fix/native-source-compat ]
    paths:
      - '.github/workflows/native-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect coin-control migration rejects
        shell: bash
        run: |
          set -euo pipefail
          MONERO_COMMIT=43c31c2aacdd789404d16cfda0c5456e0a090b86
          PATCH_BASE=33671871de3d51696b66ffb3bd94f744e26974f6
          git init monero
          git -C monero remote add origin https://github.com/monero-project/monero.git
          git -C monero fetch --depth 1 origin "$MONERO_COMMIT"
          git -C monero checkout --detach FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/patches"
          curl -fsSL "https://raw.githubusercontent.com/MrCyjaneK/monero_c/$PATCH_BASE/patches/monero/0008-coin-control.patch" -o "$RUNNER_TEMP/patches/0008.patch"
          curl -fsSL "https://raw.githubusercontent.com/MrCyjaneK/monero_c/$PATCH_BASE/patches/monero/0005-UR-functions.patch" -o "$RUNNER_TEMP/patches/0005.patch"
          set +e
          git -C monero apply --reject "$RUNNER_TEMP/patches/0008.patch" 2>&1 | tee "$RUNNER_TEMP/apply.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "APPLY_RC=$rc"
          echo "=== Changed files ==="
          git -C monero status --short | head -100
          echo "=== Reject count and hunk headers ==="
          find monero -name '*.rej' -print
          grep -H -E '^(---|\+\+\+|@@)' $(find monero -name '*.rej' -print) 2>/dev/null | head -300 || true
          echo "=== Relevant UR API patch fragments ==="
          grep -n -B5 -A18 -E 'hasUnknownKeyImages|viewOnlyBalance' "$RUNNER_TEMP/patches/0005.patch" | head -180 || true
          echo "=== Coin API public interface excerpt ==="
          grep -n -B3 -A45 -E 'struct CoinsInfo|struct Coins|preferred_inputs|coins\(\)' "$RUNNER_TEMP/patches/0008.patch" | head -300 || true
