name: Probe ANONERO Monero API

on:
  push:
    branches: [ fix/native-source-compat ]
    paths:
      - '.github/workflows/native-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public ANONERO Monero source
        shell: bash
        run: |
          set -uo pipefail
          SOURCE_URL="https://gitea.com/anonero/monero.git"
          echo "Remote refs from $SOURCE_URL"
          if ! git ls-remote --heads "$SOURCE_URL" | tee "$RUNNER_TEMP/refs.txt"; then
            echo "::error::Could not read ANONERO Monero refs."
            exit 1
          fi
          for ref in refs/heads/release-v0.18.3.1-anonero refs/heads/release-v0.18.0.0-monerujo; do
            if grep -q " $ref$" "$RUNNER_TEMP/refs.txt"; then
              echo "=== Inspecting $ref ==="
              rm -rf "$RUNNER_TEMP/monero-probe"
              git init "$RUNNER_TEMP/monero-probe"
              git -C "$RUNNER_TEMP/monero-probe" remote add origin "$SOURCE_URL"
              git -C "$RUNNER_TEMP/monero-probe" fetch --depth 1 origin "$ref"
              git -C "$RUNNER_TEMP/monero-probe" checkout --detach FETCH_HEAD
              echo "COMMIT=$(git -C "$RUNNER_TEMP/monero-probe" rev-parse HEAD)"
              HEADER="$RUNNER_TEMP/monero-probe/src/wallet/api/wallet2_api.h"
              test -s "$HEADER" || { echo "::error::wallet2_api.h missing"; exit 1; }
              grep -nE 'getPolyseed|hasUnknownKeyImages|viewOnlyBalance|CoinsInfo|struct Coins|class Coins|createTransaction\(' "$HEADER" || true
            fi
          done
