name: Build ANON APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: independent pushes can build in parallel.
jobs:
  native:
    name: Build native libraries and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source and pinned Monero submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: ${{ runner.os }}-native-${{ hashFiles('.gitmodules', 'external-libs/Containerfile', 'external-libs/build.sh', 'external-libs/Makefile', 'external-libs/monero/**') }}

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config

      - name: Build native Monero libraries
        working-directory: external-libs
        run: |
          test -f monero/src/wallet/api/wallet2_api.h
          make android NPROC="$(nproc)"

      - name: Verify native outputs
        run: |
          find external-libs/arm64-v8a external-libs/armeabi-v7a -maxdepth 2 -type f -print
          test -f external-libs/include/wallet2_api.h
          test -s external-libs/VERSION

      - name: Link native wallet JNI libraries for Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_DIR" ]; then
            echo "Android NDK not found on runner" >&2
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="$RUNNER_TEMP/cmake-$ABI"
            cmake -S app -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DANON_ABI="$ABI" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$BUILD_DIR" --parallel "$(nproc)"
            mkdir -p "external-libs/prebuilt/$ABI"
            install -m 0644 "$BUILD_DIR/libanonero.so" "external-libs/prebuilt/$ABI/libanonero.so"
          done
          test -s external-libs/prebuilt/arm64-v8a/libanonero.so
          test -s external-libs/prebuilt/armeabi-v7a/libanonero.so

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew --no-daemon --parallel --build-cache assembleAnonDebug assembleNeroDebug

      - name: Verify APK outputs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APKs and native build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anon-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            external-libs/VERSION
            external-libs/arm64-v8a/
            external-libs/armeabi-v7a/
          if-no-files-found: warn
          retention-days: 14
