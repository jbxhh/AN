name: Build ANON APK
on:
  workflow_dispatch:
  push:
    branches: [main, fix/native-api-compatible-base]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/kotlin/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/build.gradle.kts'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/main.yml'
env:
  JAVA_VERSION: '17'
concurrency:
  # Do not queue or cancel separate APK builds behind one another.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the latest commit on the branch. Java-only fixes may be pushed
          # while the native workflow is running; pinning workflow_run.head_sha
          # would silently omit those fixes from the resulting APK.
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Select native library artifact run
        id: native-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=100" --jq '[.workflow_runs[] | select(.name == "Native Monero Libs (Polyseed support)")] | .[0].id // empty')"
          if [[ ! "${native_run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::No successful native-libraries run found for branch ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Using native library workflow run: ${native_run_id}"
          echo "run_id=${native_run_id}" >> "${GITHUB_OUTPUT}"
      - name: Download verified cached Monero native libraries
        uses: actions/download-artifact@v4
        with:
          name: monero-android-libs-monero-api-compatible-33671871
          run-id: ${{ steps.native-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: external-libs
      - name: Verify cached Monero Polyseed-support libraries
        run: |
          set -euo pipefail
          test -s external-libs/include/wallet2_api.h
          test -s external-libs/VERSION
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" external-libs/include/wallet2_api.h
          grep -Fq "hasUnknownKeyImages() const" external-libs/include/wallet2_api.h
          grep -Fq "viewOnlyBalance" external-libs/include/wallet2_api.h
          grep -Fq "struct CoinsInfo" external-libs/include/wallet2_api.h
          grep -Fq "preferred_inputs" external-libs/include/wallet2_api.h
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            if [ "$count" -lt 20 ]; then
              echo "::error::Incomplete Monero static-library cache for $abi ($count archives found)."
              exit 1
            fi
            echo "$abi: $count static archives verified"
          done
      - run: chmod +x ./gradlew
      - name: Run ANON unit tests
        run: ./gradlew :app:testAnonDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        id: build
        run: |
          set -euo pipefail
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
