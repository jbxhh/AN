name: Build ANON APK
"on":
  push:
    branches: [ main ]
    # Native C++/CMake/dependency changes are built by native-libs first.
    # Build the APK from push events only for app/Gradle sources that can
    # reuse an existing native cache; native workflow success triggers APK.
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/kotlin/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/build.gradle.kts'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/main.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Native Monero Libs (Polyseed support)"]
    types: [completed]
    branches: [main]
env:
  JAVA_VERSION: '17'
concurrency:
  # Do not discard a valid APK build when another commit arrives.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  build:
    name: Build APK
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      # Restore the same independent cache keys used by native-libs.yml.
      # The native workflow deliberately saves arm64, armv7, and JNI separately;
      # a combined cache key can never hit those entries.
      - name: Restore arm64 Monero native libraries
        id: native-cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-43c31c2aacdd789404d16cfda0c5456e0a090b86-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Restore armv7 Monero native libraries
        id: native-cache-armv7
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anon-native-armv7-43c31c2aacdd789404d16cfda0c5456e0a090b86-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Restore JNI shared libraries
        id: native-cache-jni
        uses: actions/cache/restore@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-ndk27.2.12479018-cmake3.22.1-api26-43c31c2aacdd789404d16cfda0c5456e0a090b86-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Verify cached Monero Polyseed-support libraries
        run: |
          set -euo pipefail
          for cache in arm64 armv7 jni; do
            case "$cache" in
              arm64) hit="${{ steps.native-cache-arm64.outputs.cache-hit }}" ;;
              armv7) hit="${{ steps.native-cache-armv7.outputs.cache-hit }}" ;;
              jni) hit="${{ steps.native-cache-jni.outputs.cache-hit }}" ;;
            esac
            if [ "$hit" != "true" ]; then
              echo "::error::Monero $cache cache miss. Run 'Native Monero Libs (Polyseed support)' to build and cache libraries first; APK workflow intentionally does not compile Monero C++ sources."
              exit 1
            fi
          done
          test -s external-libs/include/wallet2_api.h
          grep -Fq "monero polyseed-support-2026-09-20 (43c31c2aacdd789404d16cfda0c5456e0a090b86)" external-libs/VERSION
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            if [ "$count" -lt 20 ]; then
              echo "::error::Incomplete Monero static-library cache for $abi ($count archives found)."
              exit 1
            fi
            echo "$abi: $count static archives verified"
          done
      - run: chmod +x ./gradlew
      - name: Build APK
        id: build
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
