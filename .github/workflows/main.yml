name: Build ANON APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/native-api-compatible-base, experiment/an-rust-port]
    paths:
      - 'app/**'
      - 'external-libs/Makefile'
      - 'external-libs/build.sh'
      - 'external-libs/Containerfile'
      - 'external-libs/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/main.yml'
      - 'rust-wallet/**'
      - 'RUST_MIGRATION.md'

permissions:
  contents: read

# Do not cancel or serialize builds by branch; let GitHub schedule each run independently.

env:
  MONERO_REF: v0.18.5.3
  MONERO_COMMIT: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
  MONERO_PATCH_COMMIT: 33671871de3d51696b66ffb3bd94f744e26974f6
  NATIVE_CACHE_SCHEMA: v5

jobs:
  source-check:
    name: Validate wallet Kotlin/Java sources
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" >/dev/null
          echo "Android SDK ready for source check"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Compile wallet Kotlin/Java before native work
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileAnonDebugKotlin :app:compileAnonDebugJavaWithJavac :app:testAnonDebugUnitTest --no-daemon --stacktrace

  build:
    name: Build native libraries and APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure APK signing (persistent key or safe CI fallback)
        shell: bash
        env:
          ANONERO_KEYSTORE_BASE64: ${{ secrets.ANONERO_KEYSTORE_BASE64 }}
          ANONERO_KEYSTORE_PASSWORD: ${{ secrets.ANONERO_KEYSTORE_PASSWORD }}
          ANONERO_KEY_ALIAS: ${{ secrets.ANONERO_KEY_ALIAS }}
          ANONERO_KEY_PASSWORD: ${{ secrets.ANONERO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANONERO_KEYSTORE_BASE64:-}" || -z "${ANONERO_KEYSTORE_PASSWORD:-}" || -z "${ANONERO_KEY_ALIAS:-}" || -z "${ANONERO_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Persistent signing secrets are not configured; using a run-specific package ID and temporary debug signing for this CI APK."
            echo "ANONERO_EPHEMERAL_SIGNING=true" >> "$GITHUB_ENV"
            exit 0
          fi
          keystore="$RUNNER_TEMP/anonero-release.jks"
          printf "%s" "$ANONERO_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$ANONERO_KEYSTORE_PASSWORD" -alias "$ANONERO_KEY_ALIAS" >/dev/null
          printf "ANONERO_KEYSTORE_PATH=%s\n" "$keystore" >> "$GITHUB_ENV"
          printf "ANONERO_KEYSTORE_PASSWORD=%s\n" "$ANONERO_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf "ANONERO_KEY_ALIAS=%s\n" "$ANONERO_KEY_ALIAS" >> "$GITHUB_ENV"
          printf "ANONERO_KEY_PASSWORD=%s\n" "$ANONERO_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          echo "Android SDK ready"

      # The source-check and native/APK jobs use separate runners. Reuse the
      # same Gradle dependency/build cache to avoid resolving and compiling cold.
      - name: Restore Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Keep each ABI in its own immutable cache. If one ABI fails, the other
      # ABI's completed cache is still available to later runs.
      - name: Restore arm64 native library cache
        id: cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/patches/patch-wallet-scan-height.py') }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Validate restored arm64 native cache
        id: validate-arm64-cache
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ "${{ steps.cache-arm64.outputs.cache-hit }}" == "true" ]] &&
             test -s external-libs/arm64-v8a/monero/libwallet_api.a &&
             test -s external-libs/arm64-v8a/monero/libpolyseed_wrapper.a &&
             test -s external-libs/arm64-v8a/libpolyseed.a &&
             test -s external-libs/include/wallet2_api.h &&
             test "$(find external-libs/arm64-v8a -type f -name '*.a' | wc -l)" -ge 20; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "arm64 native cache valid: $valid"

      - name: Restore JNI library cache
        id: cache-jni
        uses: actions/cache/restore@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-ndk27.2.12479018-cmake3.22.1-api26-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/patches/patch-wallet-scan-height.py') }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Validate restored JNI cache
        id: validate-jni-cache
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ "${{ steps.cache-jni.outputs.cache-hit }}" == "true" ]] &&
             test -s external-libs/prebuilt/arm64-v8a/libanonero.so &&
             test -s external-libs/prebuilt/arm64-v8a/libc++_shared.so; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "JNI cache valid: $valid"

      - name: Checkout Monero source and apply matching ANONERO API patch series
        if: steps.validate-arm64-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          rm -rf external-libs/monero "$RUNNER_TEMP/monero_c"
          git init external-libs/monero
          git -C external-libs/monero remote add origin https://github.com/monero-project/monero.git
          # Fetch the tag into the local tag namespace; fetching only into FETCH_HEAD
          # leaves git describe --tags unable to find a name in a shallow checkout.
          git -C external-libs/monero fetch --depth 1 origin "refs/tags/${MONERO_REF}:refs/tags/${MONERO_REF}"
          git -C external-libs/monero checkout --detach "refs/tags/${MONERO_REF}"
          actual="$(git -C external-libs/monero rev-parse HEAD)"
          tag="$(git -C external-libs/monero describe --tags --exact-match HEAD)"
          echo "Monero official tag: $tag"
          echo "Monero base HEAD:    $actual"
          echo "Expected tag:        ${MONERO_REF}"
          echo "Expected commit:     ${MONERO_COMMIT}"
          test "$tag" = "${MONERO_REF}" || {
            echo "::error::Checked-out Monero tag does not match the requested official release."
            exit 1
          }
          test "$actual" = "${MONERO_COMMIT}" || {
            echo "::error::Official Monero release tag resolves to an unexpected commit."
            exit 1
          }

          # ANONERO calls custom wallet APIs (encrypted Polyseed passphrase, coin
          # selection, Coins/CoinsInfo). Upstream Monero's 2026 Polyseed API does
          # not provide these methods. Apply the matching, version-pinned patch
          # series rather than compiling against a mismatched header.
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/monero_c.git "$RUNNER_TEMP/monero_c"
          git -C "$RUNNER_TEMP/monero_c" fetch --depth 1 origin "${MONERO_PATCH_COMMIT}"
          git -C "$RUNNER_TEMP/monero_c" checkout --detach "${MONERO_PATCH_COMMIT}"
          test "$(git -C "$RUNNER_TEMP/monero_c" rev-parse HEAD)" = "${MONERO_PATCH_COMMIT}"
          git -C external-libs/monero -c user.name="AN Native Build" -c user.email="actions@users.noreply.github.com" am --3way --whitespace=fix "$RUNNER_TEMP"/monero_c/patches/monero/*.patch

          # Monero emits newBlock from two paths: transaction processing and the
          # fast-refresh hash-chain cache. Suppress the cache-only callback so the
          # app's wallet height advances only after real block processing.
          python3 external-libs/patches/patch-wallet-scan-height.py

          git -C external-libs/monero submodule update --init --recursive --depth 1

          api="external-libs/monero/src/wallet/api/wallet2_api.h"
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" "$api"
          grep -Fq "hasUnknownKeyImages() const" "$api"
          grep -Fq "viewOnlyBalance" "$api"
          grep -Fq "struct CoinsInfo" "$api"
          grep -Fq "preferred_inputs" "$api"
          echo "Verified custom wallet API: Polyseed + coin control + CoinsInfo"

      - name: Prepare cached Monero header and version
        if: steps.validate-arm64-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make include/wallet2_api.h VERSION
          test -s include/wallet2_api.h
          test -s VERSION
          cat VERSION

      - name: Build arm64 native libraries
        if: steps.validate-arm64-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make arm64-v8a NPROC="$(nproc)"
          test -s arm64-v8a/monero/libwallet_api.a
          test -s arm64-v8a/libpolyseed.a
          echo "arm64-v8a static archives: $(find arm64-v8a -name '*.a' | wc -l)"

      - name: Save arm64 native library cache
        if: steps.cache-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/patches/patch-wallet-scan-height.py') }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Build and cache JNI shared libraries
        if: steps.validate-jni-cache.outputs.valid != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for abi in arm64-v8a; do
            build_dir="$RUNNER_TEMP/anonero-$abi"
            cmake -S app -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build_dir" --target anonero --parallel "$(nproc)"
            mkdir -p "external-libs/prebuilt/$abi"
            install -m 0644 "$build_dir/libanonero.so" "external-libs/prebuilt/$abi/libanonero.so"
            libcxx_triple=aarch64-linux-android
            # NDK r27 stores the runtime in sysroot/usr/lib/<triple>.
            libcxx="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$libcxx_triple/libc++_shared.so"
            if [ ! -s "$libcxx" ]; then
              echo "::error::Missing libc++_shared.so at $libcxx"
              exit 1
            fi
            install -m 0644 "$libcxx" "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            echo "$abi: libanonero.so + libc++_shared.so ready"
          done

      - name: Save JNI library cache
        if: steps.cache-jni.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-ndk27.2.12479018-cmake3.22.1-api26-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/patches/patch-wallet-scan-height.py') }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Verify native libraries
        run: |
          set -euo pipefail
          test -s external-libs/include/wallet2_api.h
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" external-libs/include/wallet2_api.h
          grep -Fq "hasUnknownKeyImages() const" external-libs/include/wallet2_api.h
          grep -Fq "viewOnlyBalance" external-libs/include/wallet2_api.h
          grep -Fq "struct CoinsInfo" external-libs/include/wallet2_api.h
          grep -Fq "preferred_inputs" external-libs/include/wallet2_api.h
          for abi in arm64-v8a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            test "$count" -ge 20 || { echo "::error::Incomplete $abi libraries ($count archives)"; exit 1; }
            echo "$abi: $count static archives verified"
          done


      - name: Set up Rust toolchain for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test, build, and package Rust wallet core
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$TOOLCHAIN/aarch64-linux-android26-clang"
          test -x "$CLANG"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG"
          export CC_aarch64_linux_android="$CLANG"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"

          cargo test --manifest-path rust-wallet/Cargo.toml
          cargo build --manifest-path rust-wallet/Cargo.toml --release --target aarch64-linux-android

          mkdir -p external-libs/prebuilt/arm64-v8a
          RUST_LIB="rust-wallet/target/aarch64-linux-android/release/libanonero_rust.so"
          test -s "$RUST_LIB"
          "$TOOLCHAIN/llvm-strip" --strip-unneeded "$RUST_LIB"
          install -m 0644 "$RUST_LIB" external-libs/prebuilt/arm64-v8a/libanonero_rust.so
          file external-libs/prebuilt/arm64-v8a/libanonero_rust.so
          readelf -h external-libs/prebuilt/arm64-v8a/libanonero_rust.so | grep -E "Class:|Machine:"

      - name: Strip ARM64 JNI symbols and build standalone ANON APK
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded "external-libs/prebuilt/arm64-v8a/libanonero.so"
          # Each flavor is assembled as a complete, installable APK (not an App Bundle
          # and not a base/config split set). ABI split outputs each contain the full
          # app plus the matching native libraries, so no companion APK is required.
          ./gradlew :app:assembleAnonRelease --build-cache --parallel --configuration-cache --no-daemon --stacktrace
          echo "ANON APK output sizes:"
          du -h app/build/outputs/apk/anon/release/*.apk
          # Fail the workflow if the standalone ANON ARM64 APK was not produced.
          compgen -G "app/build/outputs/apk/anon/release/*arm64-v8a*.apk" >/dev/null

      - name: Upload standalone ANON APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK-arm64-standalone
          path: app/build/outputs/apk/anon/release/*arm64-v8a*.apk
          if-no-files-found: error


      - name: Summary
        run: |
          echo "### Standalone ANON APK build (native cache + wallet source)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Only the standalone ANON ARM64 APK is built and published." >> "$GITHUB_STEP_SUMMARY"
          echo "- No companion/base/config APK is required; each artifact is independently installable." >> "$GITHUB_STEP_SUMMARY"
          echo "- arm64 cache hit: ${{ steps.cache-arm64.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 32-bit ARM build: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- JNI cache hit: ${{ steps.cache-jni.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Monero official release: ${MONERO_REF} (${MONERO_COMMIT})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f external-libs/VERSION ]; then cat external-libs/VERSION >> "$GITHUB_STEP_SUMMARY"; fi
          find external-libs/arm64-v8a -name '*.a' 2>/dev/null | wc -l \
            | xargs -I{} echo "- Static archives: {}" >> "$GITHUB_STEP_SUMMARY"
