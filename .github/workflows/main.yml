name: Build ANON APK
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Native Monero Libs (Polyseed support)"]
    types: [completed]
    branches: [main]
env:
  JAVA_VERSION: '17'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    name: Build APK
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Restore prebuilt Monero native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/prebuilt
            external-libs/VERSION
          key: anon-native-polyseed-support-2026-09-20-43c31c2aacdd789404d16cfda0c5456e0a090b86-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile', 'app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}
      - name: Verify cached Monero Polyseed-support libraries
        run: |
          set -euo pipefail
          if [ "${{ steps.native-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Monero native-library cache miss. Run 'Native Monero Libs (Polyseed support)' to build and cache libraries first; APK workflow intentionally does not compile Monero C++ sources."
            exit 1
          fi
          test -s external-libs/include/wallet2_api.h
          grep -Fq "monero polyseed-support-2026-09-20 (43c31c2aacdd789404d16cfda0c5456e0a090b86)" external-libs/VERSION
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            if [ "$count" -lt 20 ]; then
              echo "::error::Incomplete Monero static-library cache for $abi ($count archives found)."
              exit 1
            fi
            echo "$abi: $count static archives verified"
          done
      - run: chmod +x ./gradlew
      - name: Build APK
        id: build
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
