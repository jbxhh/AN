name: Build ANON APK
"on":
  push:
    branches: [ main, fix/native-api-compatible-base ]
    # Native C++/CMake/dependency changes are built by native-libs first.
    # Build the APK from push events only for app/Gradle sources that can
    # reuse an existing native cache; native workflow success triggers APK.
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/kotlin/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'app/build.gradle.kts'
      - 'build.gradle'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/main.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Native Monero Libs (Polyseed support)"]
    types: [completed]
    branches: [main]
env:
  JAVA_VERSION: '17'
concurrency:
  # Do not discard a valid APK build when another commit arrives.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  build:
    name: Build APK
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Download verified cached Monero native libraries
        uses: actions/download-artifact@v4
        with:
          name: monero-android-libs-monero-api-compatible-33671871
          run-id: 38553652140
          github-token: ${{ github.token }}
          path: external-libs
      - name: Verify cached Monero Polyseed-support libraries
        run: |
          set -euo pipefail
          test -s external-libs/include/wallet2_api.h
          test -s external-libs/VERSION
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" external-libs/include/wallet2_api.h
          grep -Fq "hasUnknownKeyImages() const" external-libs/include/wallet2_api.h
          grep -Fq "viewOnlyBalance" external-libs/include/wallet2_api.h
          grep -Fq "struct CoinsInfo" external-libs/include/wallet2_api.h
          grep -Fq "preferred_inputs" external-libs/include/wallet2_api.h
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            if [ "$count" -lt 20 ]; then
              echo "::error::Incomplete Monero static-library cache for $abi ($count archives found)."
              exit 1
            fi
            echo "$abi: $count static archives verified"
          done
      - run: chmod +x ./gradlew
      - name: Build APK
        id: build
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
