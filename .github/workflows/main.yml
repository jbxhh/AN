name: Build ANON APK
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  ANONERO_MONERO_ONION: 'http://git.anonero5wmhraxqsvzq2ncgptq6gq45qoto6fnkfwughfl4gbt44swad.onion/ANONERO/monero.git'
  ANONERO_MONERO_BRANCH: 'release-v0.18.0.0-monerujo'
permissions:
  contents: read
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
          key: anon-native-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}
      - name: Install and start Tor
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          tor --hash-password "" || true
          (tor -f /dev/null --SocksPort 127.0.0.1:9050 > /tmp/tor.log 2>&1 &)
          echo "Waiting for Tor bootstrap..."
          for i in $(seq 1 60); do
            if grep -q "Bootstrapped 100%" /tmp/tor.log 2>/dev/null; then
              echo "Tor bootstrapped after $i tries"
              break
            fi
            sleep 5
          done
          grep "Bootstrapped" /tmp/tor.log | tail -5 || true
      - name: Prepare Monero native source (via Tor)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf external-libs/monero
          git -c http.proxy=socks5h://127.0.0.1:9050 \
              -c https.proxy=socks5h://127.0.0.1:9050 \
              clone --depth 1 --branch "${ANONERO_MONERO_BRANCH}" \
              "${ANONERO_MONERO_ONION}" external-libs/monero
          git -C external-libs/monero -c http.proxy=socks5h://127.0.0.1:9050 \
              submodule update --init --recursive
      - name: Build Monero native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          make -C external-libs android NPROC=4
      - run: chmod +x ./gradlew
      - name: Build APK
        id: build
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
