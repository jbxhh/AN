name: Build ANON APK
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
permissions:
  contents: read
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;26.1.10909125" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Cache native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/armeabi-v7a
            external-libs/include
          key: anon-native-v0.18.5.3-22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}
      - name: Prepare Monero native source
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf external-libs/monero
          git clone --depth 1 --branch v0.18.5.3 https://github.com/monero-project/monero.git external-libs/monero
          git -C external-libs/monero submodule update --init --recursive
      - name: Build Monero native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          make -C external-libs android NPROC=4
      - run: chmod +x ./gradlew
      - name: Build APK
        id: build
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
