name: Build ANON APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/native-api-compatible-base]
    paths:
      - 'app/**'
      - 'external-libs/Makefile'
      - 'external-libs/build.sh'
      - 'external-libs/Containerfile'
      - 'external-libs/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/main.yml'

permissions:
  contents: read

env:
  MONERO_REF: v0.18.5.3
  MONERO_COMMIT: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
  MONERO_PATCH_COMMIT: 33671871de3d51696b66ffb3bd94f744e26974f6
  NATIVE_CACHE_SCHEMA: v3

jobs:
  source-check:
    name: Validate wallet Kotlin/Java sources
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" >/dev/null
          echo "Android SDK ready for source check"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Compile wallet Kotlin/Java before native work
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileAnonDebugKotlin :app:compileAnonDebugJavaWithJavac :app:testAnonDebugUnitTest --no-daemon --stacktrace

  build:
    needs: source-check
    name: Build native libraries and APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          echo "Android SDK ready"


      # Keep each ABI in its own immutable cache. If one ABI fails, the other
      # ABI's completed cache is still available to later runs.
      - name: Restore arm64 native library cache
        id: cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Restore armv7 native library cache
        id: cache-armv7
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anon-native-armv7-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Validate restored arm64 native cache
        id: validate-arm64-cache
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ "${{ steps.cache-arm64.outputs.cache-hit }}" == "true" ]] &&
             test -s external-libs/arm64-v8a/monero/libwallet_api.a &&
             test -s external-libs/arm64-v8a/libpolyseed_wrapper.a &&
             test -s external-libs/arm64-v8a/libpolyseed.a &&
             test -s external-libs/include/wallet2_api.h &&
             test "$(find external-libs/arm64-v8a -type f -name '*.a' | wc -l)" -ge 20; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "arm64 native cache valid: $valid"

      - name: Validate restored armv7 native cache
        id: validate-armv7-cache
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ "${{ steps.cache-armv7.outputs.cache-hit }}" == "true" ]] &&
             test -s external-libs/armeabi-v7a/monero/libwallet_api.a &&
             test -s external-libs/armeabi-v7a/libpolyseed_wrapper.a &&
             test -s external-libs/armeabi-v7a/libpolyseed.a &&
             test -s external-libs/include/wallet2_api.h &&
             test "$(find external-libs/armeabi-v7a -type f -name '*.a' | wc -l)" -ge 20; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "armv7 native cache valid: $valid"

      # JNI changes should relink libanonero.so, not rebuild Monero's large
      # dependency graph. Its key still includes the exact native input versions.
      - name: Restore JNI library cache
        id: cache-jni
        uses: actions/cache/restore@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-${{ env.NATIVE_CACHE_SCHEMA }}-ndk27.2.12479018-cmake3.22.1-api26-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Validate restored JNI cache
        id: validate-jni-cache
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ "${{ steps.cache-jni.outputs.cache-hit }}" == "true" ]] &&
             test -s external-libs/prebuilt/arm64-v8a/libanonero.so &&
             test -s external-libs/prebuilt/arm64-v8a/libc++_shared.so &&
             test -s external-libs/prebuilt/armeabi-v7a/libanonero.so &&
             test -s external-libs/prebuilt/armeabi-v7a/libc++_shared.so; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "JNI cache valid: $valid"

      - name: Checkout Monero source and apply matching ANONERO API patch series
        if: steps.validate-arm64-cache.outputs.valid != 'true' || steps.validate-armv7-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          rm -rf external-libs/monero "$RUNNER_TEMP/monero_c"
          git init external-libs/monero
          git -C external-libs/monero remote add origin https://github.com/monero-project/monero.git
          git -C external-libs/monero fetch --depth 1 origin "refs/tags/${MONERO_REF}"
          git -C external-libs/monero checkout --detach FETCH_HEAD
          actual="$(git -C external-libs/monero rev-parse HEAD)"
          tag="$(git -C external-libs/monero describe --tags --exact-match HEAD)"
          echo "Monero official tag: $tag"
          echo "Monero base HEAD:    $actual"
          echo "Expected tag:        ${MONERO_REF}"
          echo "Expected commit:     ${MONERO_COMMIT}"
          test "$tag" = "${MONERO_REF}" || {
            echo "::error::Checked-out Monero tag does not match the requested official release."
            exit 1
          }
          test "$actual" = "${MONERO_COMMIT}" || {
            echo "::error::Official Monero release tag resolves to an unexpected commit."
            exit 1
          }

          # ANONERO calls custom wallet APIs (encrypted Polyseed passphrase, coin
          # selection, Coins/CoinsInfo). Upstream Monero's 2026 Polyseed API does
          # not provide these methods. Apply the matching, version-pinned patch
          # series rather than compiling against a mismatched header.
          git clone --filter=blob:none --no-checkout https://github.com/MrCyjaneK/monero_c.git "$RUNNER_TEMP/monero_c"
          git -C "$RUNNER_TEMP/monero_c" fetch --depth 1 origin "${MONERO_PATCH_COMMIT}"
          git -C "$RUNNER_TEMP/monero_c" checkout --detach "${MONERO_PATCH_COMMIT}"
          test "$(git -C "$RUNNER_TEMP/monero_c" rev-parse HEAD)" = "${MONERO_PATCH_COMMIT}"
          git -C external-libs/monero -c user.name="AN Native Build" -c user.email="actions@users.noreply.github.com" am --3way --whitespace=fix "$RUNNER_TEMP"/monero_c/patches/monero/*.patch
          git -C external-libs/monero submodule update --init --recursive --depth 1

          api="external-libs/monero/src/wallet/api/wallet2_api.h"
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" "$api"
          grep -Fq "hasUnknownKeyImages() const" "$api"
          grep -Fq "viewOnlyBalance" "$api"
          grep -Fq "struct CoinsInfo" "$api"
          grep -Fq "preferred_inputs" "$api"
          echo "Verified custom wallet API: Polyseed + coin control + CoinsInfo"

      - name: Prepare cached Monero header and version
        if: steps.validate-arm64-cache.outputs.valid != 'true' || steps.validate-armv7-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make include/wallet2_api.h VERSION
          test -s include/wallet2_api.h
          test -s VERSION
          cat VERSION

      - name: Build arm64 native libraries
        if: steps.validate-arm64-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make arm64-v8a NPROC="$(nproc)"
          test -s arm64-v8a/monero/libwallet_api.a
          test -s arm64-v8a/libpolyseed.a
          echo "arm64-v8a static archives: $(find arm64-v8a -name '*.a' | wc -l)"

      - name: Save arm64 native library cache
        if: steps.cache-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Build armv7 native libraries
        if: steps.validate-armv7-cache.outputs.valid != 'true'
        run: |
          set -euo pipefail
          cd external-libs
          make armeabi-v7a NPROC="$(nproc)"
          test -s armeabi-v7a/monero/libwallet_api.a
          test -s armeabi-v7a/libpolyseed.a
          echo "armeabi-v7a static archives: $(find armeabi-v7a -name '*.a' | wc -l)"

      - name: Save armv7 native library cache
        if: steps.cache-armv7.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anon-native-armv7-${{ env.NATIVE_CACHE_SCHEMA }}-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Build and cache JNI shared libraries
        if: steps.validate-jni-cache.outputs.valid != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for abi in arm64-v8a armeabi-v7a; do
            build_dir="$RUNNER_TEMP/anonero-$abi"
            cmake -S app -B "$build_dir" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build_dir" --target anonero --parallel "$(nproc)"
            mkdir -p "external-libs/prebuilt/$abi"
            install -m 0644 "$build_dir/libanonero.so" "external-libs/prebuilt/$abi/libanonero.so"
            case "$abi" in
              arm64-v8a) libcxx_triple=aarch64-linux-android ;;
              armeabi-v7a) libcxx_triple=arm-linux-androideabi ;;
              *) echo "::error::Unsupported Android ABI: $abi"; exit 1 ;;
            esac
            # NDK r27 stores the runtime in sysroot/usr/lib/<triple>.
            libcxx="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$libcxx_triple/libc++_shared.so"
            if [ ! -s "$libcxx" ]; then
              echo "::error::Missing libc++_shared.so at $libcxx"
              exit 1
            fi
            install -m 0644 "$libcxx" "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            echo "$abi: libanonero.so + libc++_shared.so ready"
          done

      - name: Save JNI library cache
        if: steps.cache-jni.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-${{ env.NATIVE_CACHE_SCHEMA }}-ndk27.2.12479018-cmake3.22.1-api26-${{ env.MONERO_COMMIT }}-${{ env.MONERO_PATCH_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Verify native libraries
        run: |
          set -euo pipefail
          test -s external-libs/include/wallet2_api.h
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" external-libs/include/wallet2_api.h
          grep -Fq "hasUnknownKeyImages() const" external-libs/include/wallet2_api.h
          grep -Fq "viewOnlyBalance" external-libs/include/wallet2_api.h
          grep -Fq "struct CoinsInfo" external-libs/include/wallet2_api.h
          grep -Fq "preferred_inputs" external-libs/include/wallet2_api.h
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            test "$count" -ge 20 || { echo "::error::Incomplete $abi libraries ($count archives)"; exit 1; }
            echo "$abi: $count static archives verified"
          done


      - name: Build APK
        run: ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### ANON APK build (native cache + wallet source)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK build runs in this same workflow after native cache restore/build." >> "$GITHUB_STEP_SUMMARY"
          echo "- arm64 cache hit: ${{ steps.cache-arm64.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- armv7 cache hit: ${{ steps.cache-armv7.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- JNI cache hit: ${{ steps.cache-jni.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Monero official release: ${MONERO_REF} (${MONERO_COMMIT})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ANON-APK" >> "$GITHUB_STEP_SUMMARY"
          if [ -f external-libs/VERSION ]; then cat external-libs/VERSION >> "$GITHUB_STEP_SUMMARY"; fi
          find external-libs/arm64-v8a external-libs/armeabi-v7a -name '*.a' 2>/dev/null | wc -l \
            | xargs -I{} echo "- Static archives: {}" >> "$GITHUB_STEP_SUMMARY"
