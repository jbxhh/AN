name: Build ANON APK
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Native Monero Libs (Polyseed support)"]
    types: [completed]
    branches: [main, fix/native-api-compatible-base]
env:
  JAVA_VERSION: '17'
  MONERO_COMMIT: 22578c3f7d7b4b6dd85ff7daa42a827d97cc53d0
concurrency:
  # Do not queue or cancel separate APK builds behind one another.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the latest commit on the branch. Java-only fixes may be pushed
          # while the native workflow is running; pinning workflow_run.head_sha
          # would silently omit those fixes from the resulting APK.
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      # Reuse the native-library caches directly. The wallet APK build does not
      # need to wait for a separate native workflow or a successful-run artifact.
      - name: Restore arm64 native library cache
        id: cache-arm64
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/arm64-v8a
            external-libs/include
            external-libs/VERSION
          key: anon-native-arm64-${{ env.MONERO_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Restore armv7 native library cache
        id: cache-armv7
        uses: actions/cache/restore@v4
        with:
          path: |
            external-libs/armeabi-v7a
            external-libs/include
            external-libs/VERSION
          key: anon-native-armv7-${{ env.MONERO_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}

      - name: Restore JNI library cache
        id: cache-jni
        uses: actions/cache/restore@v4
        with:
          path: external-libs/prebuilt
          key: anon-jni-ndk27.2.12479018-cmake3.22.1-api26-${{ env.MONERO_COMMIT }}-${{ hashFiles('external-libs/build.sh', 'external-libs/Containerfile', 'external-libs/Makefile') }}-${{ hashFiles('app/CMakeLists.txt', 'app/src/main/cpp/anonero.cpp', 'app/src/main/cpp/anonero.h') }}

      - name: Verify cached Monero Polyseed-support libraries
        run: |
          set -euo pipefail
          test -s external-libs/include/wallet2_api.h
          test -s external-libs/VERSION
          grep -Fq "getPolyseed(std::string &seed, std::string &passphrase)" external-libs/include/wallet2_api.h
          grep -Fq "hasUnknownKeyImages() const" external-libs/include/wallet2_api.h
          grep -Fq "viewOnlyBalance" external-libs/include/wallet2_api.h
          grep -Fq "struct CoinsInfo" external-libs/include/wallet2_api.h
          grep -Fq "preferred_inputs" external-libs/include/wallet2_api.h
          for abi in arm64-v8a armeabi-v7a; do
            test -s "external-libs/prebuilt/$abi/libanonero.so"
            test -s "external-libs/prebuilt/$abi/libc++_shared.so"
            test -s "external-libs/$abi/monero/libwallet_api.a"
            test -s "external-libs/$abi/monero/libpolyseed_wrapper.a"
            test -s "external-libs/$abi/libpolyseed.a"
            count=$(find "external-libs/$abi" -type f -name '*.a' | wc -l)
            if [ "$count" -lt 20 ]; then
              echo "::error::Incomplete Monero static-library cache for $abi ($count archives found)."
              exit 1
            fi
            echo "$abi: $count static archives verified"
          done
      - run: chmod +x ./gradlew
      - name: Run ANON unit tests
        run: ./gradlew :app:testAnonDebugUnitTest --no-daemon --stacktrace
      - name: Build APK
        id: build
        run: |
          set -euo pipefail
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
