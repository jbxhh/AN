name: UI-Only Fast APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
permissions:
  contents: read
jobs:
  build:
    name: Build UI-Only APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1
          echo "Android SDK ready"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ui-${{ hashFiles('**/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-ui-
      - run: chmod +x ./gradlew
      - name: Build UI-Only Debug APK
        run: |
          ./gradlew :app:assembleAnonDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-UI-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-build-logs
          path: build.log
