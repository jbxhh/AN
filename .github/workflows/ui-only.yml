name: UI-Only Fast APK
# Manual fallback only. Do not run a UI-only APK build on every push;
# it can report success while the real wallet/native APK build fails.
on:
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.compiler.execution.strategy=in-process
permissions:
  contents: read
jobs:
  build:
    name: Build UI-Only APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - run: chmod +x ./gradlew
      - name: Build UI-Only Debug APK
        run: |
          ./gradlew :app:assembleAnonDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            --configuration-cache \
            -x test \
            -x lint \
            -x check \
            --stacktrace 2>&1 | tee build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANON-UI-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-build-logs
          path: build.log
          retention-days: 1
